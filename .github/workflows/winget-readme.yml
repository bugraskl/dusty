name: winget → README

# Checks every day whether the winget-pkgs PR for bugraskl.dusty was merged.
# When it is, it adds `winget install bugraskl.dusty` to the README and turns itself off.
# If the PR is closed without merging, it turns itself off and fails, so you get an e-mail.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  WINGET_PR: "478597"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Look up the winget-pkgs PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "$WINGET_PR" -R microsoft/winget-pkgs --json state,mergedAt \
            --jq '"state=\(.state)\nmerged=\(.mergedAt // "")"' >> "$GITHUB_OUTPUT"
          gh pr view "$WINGET_PR" -R microsoft/winget-pkgs --json state,mergedAt,labels \
            --jq '"winget PR #'"$WINGET_PR"': \(.state) \(.mergedAt // "") labels: \([.labels[].name] | join(", "))"'

      - name: Add winget to the README
        if: steps.pr.outputs.merged != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/add_winget_readme.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "README: add winget install (bugraskl.dusty is in winget-pkgs)"
            git push
          fi
          gh workflow disable winget-readme.yml -R "$GITHUB_REPOSITORY"

      - name: PR closed without merging
        if: steps.pr.outputs.state == 'CLOSED' && steps.pr.outputs.merged == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable winget-readme.yml -R "$GITHUB_REPOSITORY"
          echo "::error::winget-pkgs PR #$WINGET_PR was closed without merging; README not changed"
          exit 1
